### model
model_name_or_path: "./Qwen2.5-VL-7B-Instruct"
image_max_pixels: 1048576
video_max_pixels: 16384
trust_remote_code: true
local_qwen2_5_vl_path: "./qwen2_5_vl"

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_target: all
freeze_multi_modal_projector: false

### dataset
dataset: EarthVQA
template: qwen2_vl
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
max_samples: 800

use_semantic_patches: true
global_downsample: true
semantic_patch_size: 28
# Default: FastSAM
sam_checkpoint: "./FastSAM-main/weights/FastSAM-x.pt"
sam_backend: "fastsam"
# Optional: Meta SAM (uncomment below and comment out the FastSAM block above)
# sam_checkpoint: "./segment-anything-main/models/sam_vit_h_4b8939.pth"
# sam_model_type: "vit_h"
# sam_backend: "sam"

### output
output_dir: "./outputs/EarthVQA-qwen2.5vl-7B-heatok"
logging_steps: 10
save_steps: 400
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
flash_attn: fa2
ddp_timeout: 180000000
resume_from_checkpoint: null
### eval
